name: Release
# Publishes a release for the version in manifest.json the first time that version reaches main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test
        run: node build.js && node --test test/*.test.js
      - name: Publish release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./manifest.json').version")
          if gh release view "$V" >/dev/null 2>&1; then echo "Release $V already exists"; exit 0; fi
          gh release create "$V" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "$V" --generate-notes
